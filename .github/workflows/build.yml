name: build-and-push
on:
  push:
    branches: [main]

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./docker-dev-base
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dev-base:latest

  node:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./docker-dev-node
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dev-node:latest
          build-args: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/dev-base:latest
